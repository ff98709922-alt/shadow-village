<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#101827">
<title>Shadow Village — 3D Prototype</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101827;font-family:system-ui,Arial;color:white;touch-action:none}
#game{position:fixed;inset:0}canvas{display:block}
#hud{position:fixed;top:12px;left:12px;padding:10px 13px;border-radius:12px;background:#101827bb;border:1px solid #ffffff30;backdrop-filter:blur(8px);font-size:14px}
#hint{position:fixed;top:12px;right:12px;padding:9px 12px;border-radius:12px;background:#101827bb;border:1px solid #ffffff30;font-size:12px}
#stick{position:fixed;left:22px;bottom:24px;width:116px;height:116px;border-radius:50%;background:#ffffff24;border:2px solid #ffffff55}
#knob{position:absolute;left:33px;top:33px;width:46px;height:46px;border-radius:50%;background:#ffffffa8;border:2px solid white}
#talk{position:fixed;right:22px;bottom:30px;border:1px solid #ffffff70;border-radius:50%;width:72px;height:72px;background:#f59e0b;color:#1b1b1b;font-weight:800;font-size:13px}
#message{position:fixed;left:50%;bottom:160px;transform:translateX(-50%);padding:10px 14px;border-radius:10px;background:#101827dd;border:1px solid #ffffff44;display:none;max-width:85%;text-align:center;font-size:14px}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud"><b>SHADOW VILLAGE</b><br>Ren · Level 1<br><span style="color:#86efac">Prototype 01</span></div>
<div id="hint">Explore the village</div>
<div id="stick"><div id="knob"></div></div>
<button id="talk">TALK</button>
<div id="message">Welcome to the village! Find your first mission.</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8fc8f2);
scene.fog = new THREE.Fog(0x8fc8f2, 28, 85);
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, .1, 150);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.querySelector('#game').appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x64748b,2));
const sun = new THREE.DirectionalLight(0xffffff,2.2);
sun.position.set(-12,22,12); sun.castShadow=true; sun.shadow.mapSize.set(1024,1024); scene.add(sun);

const mat=(color,roughness=.85)=>new THREE.MeshStandardMaterial({color,roughness});
const ground = new THREE.Mesh(new THREE.PlaneGeometry(120,120),mat(0x75a96a));
ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);

function box(w,h,d,color,x,y,z){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(color)); m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);return m;
}
function tree(x,z){
 const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.18,.25,2,7),mat(0x795238));trunk.position.set(x,1,z);trunk.castShadow=true;scene.add(trunk);
 const crown=new THREE.Mesh(new THREE.SphereGeometry(1.25,8,7),mat(0x32865a));crown.position.set(x,2.6,z);crown.castShadow=true;scene.add(crown);
}
function house(x,z,wall,roof){
 box(5,3.2,4,wall,x,1.6,z);
 const r=new THREE.Mesh(new THREE.ConeGeometry(3.8,1.8,4),mat(roof));r.rotation.y=Math.PI/4;r.position.set(x,4,z);r.castShadow=true;scene.add(r);
 box(1.1,2,.12,0x49372d,x,1,z+2.06);
}
for(let i=-3;i<=3;i++){house(i*9,-12,0xe9c99a,0x963f38);house(i*9,17,0xd7b78e,0x394b68);}
for(let i=0;i<18;i++){tree(-18+(i%6)*7,-25+Math.floor(i/6)*8);tree(18-(i%6)*7,-24+Math.floor(i/6)*8);}
const road=box(13,.04,70,0xc7b18b,0,.02,1);

const player=new THREE.Group();scene.add(player);
const body=new THREE.Mesh(new THREE.CylinderGeometry(.48,.58,1.35,10),mat(0xf07822));body.position.y=1.35;body.castShadow=true;player.add(body);
const jacket=new THREE.Mesh(new THREE.SphereGeometry(.52,12,10),mat(0x243c59));jacket.scale.set(1,.75,.8);jacket.position.set(0,1.65,0.02);player.add(jacket);
const head=new THREE.Mesh(new THREE.SphereGeometry(.43,16,12),mat(0xffc99e));head.position.y=2.35;head.castShadow=true;player.add(head);
const hair=new THREE.Mesh(new THREE.SphereGeometry(.47,8,7),mat(0xf2c438));hair.scale.set(1.05,.7,1);hair.position.set(0,2.65,-.03);player.add(hair);
for(let i=0;i<7;i++){const spike=new THREE.Mesh(new THREE.ConeGeometry(.16,.55,5),mat(0xf2c438));spike.position.set(Math.sin(i*2.4)*.3,2.85,Math.cos(i*2.4)*.28);spike.rotation.x=-.35;player.add(spike);}
const band=box(.72,.13,.08,0x354b65,0,2.57,.39);player.add(band);band.position.set(0,2.57,.39);
const legs=[];
for(const x of [-.23,.23]){const leg=new THREE.Mesh(new THREE.CylinderGeometry(.16,.19,.78,8),mat(0x243c59));leg.position.set(x,.48,0);leg.castShadow=true;player.add(leg);legs.push(leg);}
player.position.set(0,0,4);

const npc=new THREE.Group();scene.add(npc);npc.position.set(3,0,-5);
const nb=new THREE.Mesh(new THREE.CylinderGeometry(.42,.5,1.25,9),mat(0x6d70b8));nb.position.y=1.25;npc.add(nb);
const nh=new THREE.Mesh(new THREE.SphereGeometry(.4,12,10),mat(0xffc99e));nh.position.y=2.15;npc.add(nh);
const nhair=new THREE.Mesh(new THREE.SphereGeometry(.44,9,8),mat(0x34314b));nhair.scale.set(1,.8,1);nhair.position.y=2.43;npc.add(nhair);
const marker=new THREE.Mesh(new THREE.ConeGeometry(.22,.45,8),mat(0xffdf55));marker.position.set(0,3.1,0);npc.add(marker);

const keys={};addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
let joy={x:0,y:0},drag=false;
const stick=document.querySelector('#stick'),knob=document.querySelector('#knob');
function setJoy(e){const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const len=Math.hypot(dx,dy),max=38;if(len>max){dx=dx/len*max;dy=dy/len*max;}joy.x=dx/max;joy.y=dy/max;knob.style.transform=`translate(${dx}px,${dy}px)`;}
stick.addEventListener('pointerdown',e=>{drag=true;stick.setPointerCapture(e.pointerId);setJoy(e)});
stick.addEventListener('pointermove',e=>{if(drag)setJoy(e)});
function resetJoy(){drag=false;joy={x:0,y:0};knob.style.transform='translate(0,0)'}
stick.addEventListener('pointerup',resetJoy);stick.addEventListener('pointercancel',resetJoy);
document.querySelector('#talk').addEventListener('click',()=>{
 const d=player.position.distanceTo(npc.position);
 const msg=document.querySelector('#message');msg.textContent=d<3.8?'Village ninja: “Welcome, Ren. Your first training mission is waiting!”':'Move closer to the village ninja to talk.';msg.style.display='block';setTimeout(()=>msg.style.display='none',2800);
});
const clock=new THREE.Clock();
function animate(){
 requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04);
 let x=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+joy.x;
 let z=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0)+joy.y;
 const v=new THREE.Vector2(x,z);if(v.length()>1)v.normalize();
 if(v.length()>.05){player.position.x+=v.x*5*dt;player.position.z+=v.y*5*dt;player.rotation.y=Math.atan2(v.x,v.y);legs[0].rotation.x=Math.sin(performance.now()*.012)*.45;legs[1].rotation.x=-legs[0].rotation.x;}
 player.position.x=THREE.MathUtils.clamp(player.position.x,-25,25);player.position.z=THREE.MathUtils.clamp(player.position.z,-30,30);
 const target=new THREE.Vector3(player.position.x,2.2,player.position.z);
 const desired=new THREE.Vector3(player.position.x,5.3,player.position.z+9);
 camera.position.lerp(desired,.09);camera.lookAt(target);
 marker.position.y=3.1+Math.sin(performance.now()*.004)*.12;
 renderer.render(scene,camera);
}
animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script>
</body>
</html>
