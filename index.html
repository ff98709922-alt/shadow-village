<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#111827"><title>Shadow Village V2</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#91c9f2;font-family:system-ui;color:white;touch-action:none}#game{position:fixed;inset:0}canvas{display:block}.panel{background:#111827c9;border:1px solid #ffffff45;border-radius:13px;backdrop-filter:blur(8px)}#hud{position:fixed;top:10px;left:10px;padding:10px 13px;font-size:13px;line-height:1.5}#quest{position:fixed;top:10px;right:10px;padding:9px 11px;font-size:12px;text-align:right}#stick{position:fixed;left:20px;bottom:22px;width:118px;height:118px;border-radius:50%;background:#17203366;border:2px solid #ffffff70}#knob{position:absolute;left:34px;top:34px;width:46px;height:46px;border-radius:50%;background:#ffffffb8;border:2px solid white}.action{position:fixed;border:1px solid #ffffff80;border-radius:50%;font-weight:800;color:white;background:#172033d9;width:58px;height:58px}#talk{right:20px;bottom:28px;width:68px;height:68px;background:#e99b25;color:#21180b}#jump{right:98px;bottom:38px}#run{right:92px;bottom:105px;width:48px;height:48px;font-size:11px}#message{position:fixed;left:50%;bottom:160px;transform:translateX(-50%);padding:11px 15px;display:none;max-width:88%;text-align:center;font-size:14px}#loading{position:fixed;inset:0;display:grid;place-items:center;background:#111827;z-index:5}
</style></head><body>
<div id="loading">Loading Shadow Village V2…</div><div id="game"></div>
<div id="hud" class="panel"><b>SHADOW VILLAGE</b><br>Ren · Level 1<br><span style="color:#86efac">Version 2 · 3D prototype</span></div>
<div id="quest" class="panel">MISSION 01<br>Meet the village guide</div>
<div id="stick"><div id="knob"></div></div><button id="run" class="action">RUN</button><button id="jump" class="action">JUMP</button><button id="talk" class="action">TALK</button><div id="message" class="panel"></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x91c9f2);scene.fog=new THREE.Fog(0x91c9f2,38,105);
const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,180);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;document.querySelector('#game').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x627a69,2.1));const sun=new THREE.DirectionalLight(0xfff1d6,2.4);sun.position.set(-18,28,16);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
const M=c=>new THREE.MeshStandardMaterial({color:c,roughness:.86});
const grass=M(0x6fa76a),path=M(0xc7b18c),wood=M(0x795238),leaf=M(0x32865a),cream=M(0xe8c99b),roof=M(0x963f38),blue=M(0x405775),orange=M(0xf07822),navy=M(0x253c5b),skin=M(0xffc99e),gold=M(0xf2c438),dark=M(0x202536),metal=M(0x9eabb9),red=M(0xb83b35),white=M(0xf2eee5);
function add(g,m,p,x=0,y=0,z=0){const o=new THREE.Mesh(g,m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;p.add(o);return o}
function cube(w,h,d,m,p,x,y,z){return add(new THREE.BoxGeometry(w,h,d),m,p,x,y,z)}
const ground=add(new THREE.PlaneGeometry(150,150),grass,scene);ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;
cube(13,.08,78,path,scene,0,.03,0);
for(let i=-3;i<=3;i++)for(const z of [-17,19]){const h=new THREE.Group();scene.add(h);h.position.set(i*10,0,z);cube(5.3,3.3,4.4,cream,h,0,1.65,0);const r=add(new THREE.ConeGeometry(4.2,2,4),i%2?blue:roof,h,0,4.25,0);r.rotation.y=Math.PI/4;cube(1.15,2,.12,wood,h,0,1,2.26);cube(1.1,.8,.08,blue,h,-1.55,2.1,2.25)}
for(let i=0;i<24;i++){const x=i%2? -22-(i%3)*2:22+(i%3)*2,z=-35+(i%8)*9;const t=new THREE.Group();scene.add(t);t.position.set(x,0,z);add(new THREE.CylinderGeometry(.18,.28,2.2,7),wood,t,0,1.1,0);add(new THREE.SphereGeometry(1.35,9,8),leaf,t,0,2.8,0);add(new THREE.SphereGeometry(.82,8,7),M(0x3b9661),t,.65,3.05,.12)}
for(let i=0;i<9;i++){const h=add(new THREE.SphereGeometry(1,10,8),M(i%2?0x719c83:0x82aa91),scene,-45+i*11,-1,-52);h.scale.set(9,12,7)}
for(const z of [-15,-5,5,15])for(const x of [-7.7,7.7]){cube(.16,2.5,.16,wood,scene,x,1.25,z);cube(.7,.55,.7,red,scene,x,2.65,z);cube(.42,.35,.42,M(0xffd78a),scene,x,2.65,z)}
// Original stylized anime ninja character assembled from 3D primitives
const player=new THREE.Group();scene.add(player);const rig=new THREE.Group();player.add(rig);const torso=new THREE.Group();rig.add(torso);
add(new THREE.CylinderGeometry(.43,.52,.95,10),orange,torso,0,1.42,0);const jacket=add(new THREE.SphereGeometry(.48,12,10),navy,torso,0,1.75,.02);jacket.scale.set(1,.65,.82);cube(.88,.16,.12,white,torso,0,1.72,.42);
const head=new THREE.Group();rig.add(head);add(new THREE.SphereGeometry(.4,16,12),skin,head,0,2.35,0);const hair=add(new THREE.SphereGeometry(.43,10,8),gold,head,0,2.61,-.04);hair.scale.set(1,.65,1);
for(let i=0;i<7;i++){const a=i*Math.PI*2/7,s=add(new THREE.ConeGeometry(.14,.52,5),gold,head,Math.cos(a)*.29,2.78,Math.sin(a)*.25);s.rotation.z=-Math.cos(a)*.55;s.rotation.x=Math.sin(a)*.35}
cube(.72,.13,.09,dark,head,0,2.57,.36);cube(.28,.12,.035,metal,head,0,2.57,.415);cube(.12,.065,.025,dark,head,0,2.57,.44);
for(const x of [-.14,.14]){add(new THREE.SphereGeometry(.045,8,8),dark,head,x,2.38,.355);add(new THREE.SphereGeometry(.018,6,6),white,head,x-.012,2.395,.39)}
const limbs=[];for(const side of [-1,1]){const arm=new THREE.Group();rig.add(arm);arm.position.set(side*.53,1.78,0);add(new THREE.CylinderGeometry(.14,.16,.68,8),orange,arm,0,-.25,0);add(new THREE.SphereGeometry(.16,8,7),skin,arm,0,-.62,.02);arm.rotation.z=side*.12;const leg=new THREE.Group();rig.add(leg);leg.position.set(side*.23,.92,0);add(new THREE.CylinderGeometry(.16,.18,.72,8),navy,leg,0,-.34,0);add(new THREE.BoxGeometry(.36,.18,.48),dark,leg,0,-.68,.1);limbs.push({arm,leg,side})}
const guide=new THREE.Group();scene.add(guide);guide.position.set(3,0,-7);add(new THREE.CylinderGeometry(.38,.46,1.1,9),M(0x5368a7),guide,0,1.2,0);add(new THREE.SphereGeometry(.37,12,10),skin,guide,0,2.05,0);const gh=add(new THREE.SphereGeometry(.4,9,8),dark,guide,0,2.32,-.04);gh.scale.set(1,.7,1);cube(.62,.12,.08,dark,guide,0,2.29,.34);const marker=add(new THREE.ConeGeometry(.2,.42,8),M(0xffdc55),guide,0,2.95,0);
const keys={};addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
let joy={x:0,y:0},drag=false;const stick=document.querySelector('#stick'),knob=document.querySelector('#knob');
function setJoy(e){const r=stick.getBoundingClientRect(),dx0=e.clientX-(r.left+r.width/2),dy0=e.clientY-(r.top+r.height/2),len=Math.hypot(dx0,dy0),k=Math.min(1,39/(len||1)),dx=dx0*k,dy=dy0*k;joy.x=dx/39;joy.y=dy/39;knob.style.transform=`translate(${dx}px,${dy}px)`}
stick.addEventListener('pointerdown',e=>{drag=true;stick.setPointerCapture(e.pointerId);setJoy(e)});stick.addEventListener('pointermove',e=>{if(drag)setJoy(e)});function reset(){drag=false;joy={x:0,y:0};knob.style.transform='translate(0,0)'}stick.addEventListener('pointerup',reset);stick.addEventListener('pointercancel',reset);
let running=false,jumpV=0,onGround=true;const run=document.querySelector('#run');run.addEventListener('pointerdown',()=>running=true);['pointerup','pointercancel','pointerleave'].forEach(e=>run.addEventListener(e,()=>running=false));
document.querySelector('#jump').addEventListener('click',()=>{if(onGround){jumpV=6.5;onGround=false}});
function message(t){const el=document.querySelector('#message');el.textContent=t;el.style.display='block';clearTimeout(message.timer);message.timer=setTimeout(()=>el.style.display='none',3000)}
document.querySelector('#talk').addEventListener('click',()=>message(player.position.distanceTo(guide.position)<4.5?'Village guide: “Welcome, Ren! Head to the training ground. Your first mission begins there.”':'Move closer to the village guide to talk.'));
const clock=new THREE.Clock();let walk=0;
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04);let x=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+joy.x,z=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0)+joy.y;const d=new THREE.Vector2(x,z);if(d.length()>1)d.normalize();const moving=d.length()>.08,speed=running?8:4.8;if(moving){player.position.x+=d.x*speed*dt;player.position.z+=d.y*speed*dt;player.rotation.y=Math.atan2(d.x,d.y);walk+=dt*(running?13:9)}
limbs.forEach(({arm,leg,side})=>{const swing=moving?Math.sin(walk)*(running?.8:.48):0;leg.rotation.x=swing*side;arm.rotation.x=-swing*side*.8});
rig.position.y+=jumpV*dt;if(!onGround||jumpV>0){jumpV-=16*dt;if(rig.position.y<=0){rig.position.y=0;jumpV=0;onGround=true}}
player.position.x=THREE.MathUtils.clamp(player.position.x,-29,29);player.position.z=THREE.MathUtils.clamp(player.position.z,-39,34);
camera.position.lerp(new THREE.Vector3(player.position.x,5.1,player.position.z+8.5),1-Math.pow(.001,dt));camera.lookAt(player.position.x,1.65,player.position.z-1.2);marker.position.y=2.95+Math.sin(performance.now()*.004)*.13;renderer.render(scene,camera)}
camera.position.set(0,5.1,12);animate();document.querySelector('#loading').style.display='none';
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
